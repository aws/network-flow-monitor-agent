# Create Amazon CloudWatch Network Flow Monitor Agent DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.daemonSet.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-network-flow-monitor-agent.labels" . | nindent 4}}
spec:
  selector:
    matchLabels:
      name: {{ .Values.daemonSet.name }}
  template:
    metadata:
      {{- if .Values.podAnnotations }}
      annotations:
      {{- range $key, $value := .Values.podAnnotations }}
        {{ $key | quote }}: {{ $value | toString | quote }}
      {{- end }}
      {{- end }}
      labels:
        name: {{ .Values.daemonSet.name }}
        {{- range $key, $value := .Values.podLabels }}
        {{- if ne $key "name" }}
        {{ $key | quote }}: {{ $value | toString | quote }}
        {{- end }}
        {{- end }}
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.daemonSet.name }}
          image: {{ include "aws-network-flow-monitor-agent.image" . }}
          securityContext:
            seLinuxOptions:
              type: control_t
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - PERFMON
                {{- if eq .Values.env.OPEN_METRICS "on" }}
                - SYS_ADMIN
                - SYS_PTRACE
                {{- end }}
              drop:
                - ALL
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.env.OPEN_METRICS "on" }}
          ports:
            - name: metrics
              containerPort: {{ .Values.env.OPEN_METRICS_PORT | int }}
              protocol: TCP
          {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.caCerts.enabled }}
            - name: AWS_CA_BUNDLE
              value: {{ printf "%s/%s" .Values.caCerts.mountPath .Values.caCerts.fileName | quote }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.caCerts.mountPath .Values.caCerts.fileName | quote }}
            {{- end }}
          volumeMounts:
            - name: host-cgroup
              mountPath: /host-cgroup
              readOnly: true
          {{- if eq .Values.env.OPEN_METRICS "on" }}
            - name: kubelet-pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
          {{- end }}
          {{- if .Values.caCerts.enabled }}
            - name: ca-bundle
              mountPath: {{ printf "%s/%s" .Values.caCerts.mountPath .Values.caCerts.fileName | quote }}
              subPath: {{ .Values.caCerts.fileName | quote }}
              readOnly: true
          {{- end }}
      volumes:
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      {{- if eq .Values.env.OPEN_METRICS "on" }}
        - name: kubelet-pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
      {{- end }}
      {{- if .Values.caCerts.enabled }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caCerts.secretName | quote }}
            {{- if .Values.caCerts.secretKey }}
            items:
              - key: {{ .Values.caCerts.secretKey | quote }}
                path: {{ .Values.caCerts.fileName | quote }}
            {{- end }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- .Values.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
